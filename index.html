<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập 31 - Tích các số chia hết cho 7</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 36px 16px; font-family: Arial, sans-serif; background: #f2f6fc; color: #20314d; }
    .card { width: min(100%, 650px); margin: 25px auto; padding: 34px; background: white; border-radius: 18px; box-shadow: 0 12px 32px rgba(38, 67, 108, .1); }
    .eyebrow { color: #2868c7; font-weight: bold; font-size: 13px; letter-spacing: 1px; }
    h1 { font-size: 26px; line-height: 1.35; margin: 12px 0; }
    p { color: #60718d; line-height: 1.65; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 22px 0; }
    label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
    input { display: block; width: 100%; border: 1px solid #c5d3e7; border-radius: 10px; padding: 13px; font: inherit; }
    input:focus { outline: 2px solid #a4c8ff; border-color: #2868c7; }
    button { background: #2366ce; color: white; font-size: 16px; font-weight: bold; padding: 14px 22px; border: 0; border-radius: 10px; cursor: pointer; width: 100%; }
    button:hover { background: #1451ad; }
    #ketQua { margin-top: 22px; border: 1px solid #d4e4fa; background: #edf5ff; border-radius: 12px; padding: 18px; line-height: 1.8; overflow-wrap: anywhere; }
    #ketQua.error { border-color: #ffd0d0; background: #fff2f2; color: #a32323; }
    .result-label { font-size: 13px; color: #547093; font-weight: bold; }
    #tich { font-size: 23px; font-weight: bold; color: #1257bd; }
    footer { text-align: center; color: #7887a0; font-size: 13px; margin-top: 26px; }
    @media(max-width: 480px) { .card { padding: 22px; margin: 8px auto; } h1 { font-size: 22px; } .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">BÀI TẬP 31 • HTML & JAVASCRIPT</div>
    <h1>Tính tích các số chia hết cho 7</h1>
    <p>Nhập số đầu và số cuối (tính cả hai đầu mút), sau đó nhấn <strong>Tính tích</strong> để xem kết quả.</p>

    <form onsubmit="handleSubmit(event)">
      <div class="fields">
        <div>
          <label for="soDau">Số đầu</label>
          <input type="number" step="1" id="soDau" value="1" placeholder="Ví dụ: 1" required>
        </div>
        <div>
          <label for="soCuoi">Số cuối</label>
          <input type="number" step="1" id="soCuoi" value="30" placeholder="Ví dụ: 30" required>
        </div>
      </div>
      <button type="submit">Tính tích</button>
    </form>

    <section id="ketQua" aria-live="polite">
      <span class="result-label">KẾT QUẢ</span>
      <div id="chiTiet">Nhấn nút “Tính tích” để bắt đầu.</div>
      <div id="tich"></div>
    </section>
    <footer>Thực hiện: Huynh Thanh Duc</footer>
  </main>

  <script>
    // BÀI TẬP 31: TÍNH TÍCH CÁC SỐ CHIA HẾT CHO 7
    function handleSubmit(event) {
      event.preventDefault(); // Không tải lại trang khi gửi form

      // Lấy hai số từ các ô nhập
      const a = Number(document.getElementById("soDau").value);
      const b = Number(document.getElementById("soCuoi").value);
      const ketQua = document.getElementById("ketQua");
      const chiTiet = document.getElementById("chiTiet");
      const hienThiTich = document.getElementById("tich");

      ketQua.classList.remove("error");
      hienThiTich.textContent = "";

      if (!Number.isSafeInteger(a) || !Number.isSafeInteger(b)) {
        ketQua.classList.add("error");
        chiTiet.textContent = "Vui lòng nhập hai số nguyên hợp lệ.";
        return;
      }
      if (a > b) {
        ketQua.classList.add("error");
        chiTiet.textContent = "Số đầu phải nhỏ hơn hoặc bằng số cuối.";
        return;
      }

      // Xác định bội của 7 đầu tiên trong đoạn [a, b]
      const batDau = Math.ceil(a / 7) * 7;
      const soLuong = batDau <= b ? Math.floor((b - batDau) / 7) + 1 : 0;
      if (soLuong > 300) {
        ketQua.classList.add("error");
        chiTiet.textContent = "Khoảng nhập có quá nhiều bội của 7. Hãy chọn khoảng nhỏ hơn (tối đa 300 bội).";
        return;
      }
      if (soLuong === 0) {
        chiTiet.textContent = "Trong khoảng này không có số nào chia hết cho 7.";
        return;
      }

      let tich = 1n; // BigInt giúp tính tích lớn chính xác
      const cacSo = [];
      for (let i = batDau; i <= b; i += 7) {
        tich *= BigInt(i);
        cacSo.push(i);
      }

      chiTiet.textContent = "Các số chia hết cho 7: " + cacSo.join(", ");
      hienThiTich.textContent = "Tích = " + tich.toString();
    }
  </script>
</body>
</html>
